<!DOCTYPE html>
<html>

<head>
<title>Azure Blob CRUD App</title>

<style>

body{
font-family:Arial;
margin:40px;
}

input{
padding:8px;
margin:5px;
}

button{
padding:8px;
cursor:pointer;
}

li{
margin:5px;
}

</style>

</head>

<body>

<h2>Azure Blob CRUD App</h2>

<h3>Add Item</h3>

<input id="itemInput" placeholder="Enter item">

<button onclick="addItem()">Add</button>

<h3>Items</h3>

<ul id="list"></ul>

<script>

const BLOB_URL = "https://blobwebapp.blob.core.windows.net/?sv=2025-11-05&ss=bfqt&srt=sco&sp=rwdlacupiytfx&se=2026-04-22T03:11:31Z&st=2026-04-20T18:56:31Z&spr=https&sig=jRNwLeMX401K93ISGpb0Tp%2FUp2OQKnr5S0sGrYBPAsw%3D";


async function getData(){

const res = await fetch(BLOB_URL);

return await res.json();

}


async function saveData(data){

await fetch(BLOB_URL,{

method:"PUT",

headers:{
"x-ms-blob-type":"BlockBlob",
"Content-Type":"application/json"
},

body: JSON.stringify(data)

});

}


async function addItem(){

const input = document.getElementById("itemInput");

const value = input.value;

if(!value) return;

const data = await getData();

data.push(value);

await saveData(data);

input.value = "";

loadItems();

}


async function deleteItem(index){

const data = await getData();

data.splice(index,1);

await saveData(data);

loadItems();

}


async function editItem(index){

const newValue = prompt("Update item:");

if(!newValue) return;

const data = await getData();

data[index] = newValue;

await saveData(data);

loadItems();

}


async function loadItems(){

const data = await getData();

const list = document.getElementById("list");

list.innerHTML = "";

data.forEach((item,index)=>{

const li = document.createElement("li");

li.innerHTML = item + 

` <button onclick="editItem(${index})">Edit</button>
<button onclick="deleteItem(${index})">Delete</button>`;

list.appendChild(li);

});

}


loadItems();

</script>

</body>

</html>
