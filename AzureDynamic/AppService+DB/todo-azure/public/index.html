<!DOCTYPE html>

<html>

<body>

<h2>Azure Todo App</h2>

<input id="todoInput">

<button onclick="addTodo()">Add</button>

<ul id="list"></ul>

<script>

async function loadTodos(){

 const res = await fetch("/api")

 const data = await res.json()

 const list =
 document.getElementById("list")

 list.innerHTML=""

 data.forEach(todo=>{

  const li =
  document.createElement("li")

  li.innerHTML =

  todo.text +

  ` <button onclick="
  deleteTodo(${todo.id})">

  delete

  </button>`

  list.appendChild(li)

 })

}

async function addTodo(){

 const text =
 document.getElementById("todoInput").value

 await fetch("/api",{

  method:"POST",

  headers:{
   "Content-Type":"application/json"
  },

  body:JSON.stringify({text})

 })

 loadTodos()

}

async function deleteTodo(id){

 await fetch("/api",{

  method:"DELETE",

  headers:{
   "Content-Type":"application/json"
  },

  body:JSON.stringify({id})

 })

 loadTodos()

}

loadTodos()

</script>

</body>

</html>
